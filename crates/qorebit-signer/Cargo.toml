[package]
name = "qorebit-signer"
version = "0.1.0"
edition = "2021"
description = "QoreChain hybrid (secp256k1 + ML-DSA-87) signing policy for the Qorebit hardware wallet: BIP-39 seeds, key derivation, transaction decoding, hybrid sign bytes"
license = "MIT OR Apache-2.0"

[dependencies]
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-87"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "sha256"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
hmac = { version = "0.12", default-features = false }
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
bip39 = { version = "2", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
bip39 = { version = "2", default-features = false }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-87"] }
hex = "0.4"
serde_json = "1"
